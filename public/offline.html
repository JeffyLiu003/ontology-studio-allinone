<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ontology Studio 离线报告</title><style>body{font:14px/1.7 system-ui;background:#f5f6fa;color:#182038;max-width:1100px;margin:40px auto;padding:20px}section{background:white;padding:24px;margin:20px 0;border-radius:12px}button,input,select{padding:9px;border:1px solid #ddd;border-radius:6px}pre{white-space:pre-wrap;word-break:break-word;background:#f1f3f8;padding:15px}a{color:#6454d8}.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.meta{color:#687187}h1{font-size:30px}</style><h1 id="title"></h1><p id="meta" class="meta"></p><section><h2>模型目录</h2><input id="q" placeholder="搜索模型"><select id="m"><option value="">全部模型</option><option>M1</option><option>M2</option><option>M3</option><option>M5</option><option>M6</option><option>M7</option><option>MU</option></select><div id="list"></div></section><section id="detail"><h2>选择一个元素查看属性、流程、查询契约与源码证据</h2></section><script>
const DATA=__ONTOLOGY_DATA__,esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;'),q=document.getElementById('q'),m=document.getElementById('m'),list=document.getElementById('list'),detail=document.getElementById('detail');document.getElementById('title').textContent=DATA.project.name+' · 本体建模报告';document.getElementById('meta').textContent=DATA.nodes.length+' 个节点 · '+DATA.edges.length+' 条关系 · '+DATA.snapshot.created_at+' · 源码反向建模评审版';function draw(){const ns=DATA.nodes.filter(n=>(!m.value||n.model===m.value)&&JSON.stringify([n.label,n.id,n.context]).toLowerCase().includes(q.value.toLowerCase()));list.innerHTML=ns.map((n,i)=>'<div class="item" data-i="'+i+'">'+esc(n.model+' · '+n.label)+' <small>'+esc(n.context)+'</small></div>').join('');list.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const n=ns[+x.dataset.i];detail.innerHTML='<h2>'+esc(n.label)+'</h2><pre>'+esc(JSON.stringify(n,null,2))+'</pre>';detail.scrollIntoView({behavior:'smooth'})})}q.oninput=m.onchange=draw;draw();
</script></html>
